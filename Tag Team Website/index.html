<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TagTeam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TAGTEAM</h1>
        <p>Work together. Reach the goal.</p>
    </header>

    <main>

        <div class="game-area">

            <div id="player1" class="character">
                P1
            </div>

            <div id="player2" class="character">
                P2
            </div>

            <div class="platform platform-1"></div>
            <div class="platform platform-2"></div>
            <div class="platform platform-3"></div>

            <div id="goal">
                GOAL
            </div>

        </div>

        <section class="controls">

            <div>
                <h2>Player 1</h2>
                <p>A / D = Move</p>
                <p>W = Jump</p>
            </div>

            <div>
                <h2>Player 2</h2>
                <p>← / → = Move</p>
                <p>↑ = Jump</p>
            </div>

        </section>

        <div class="game-status">
            <h2 id="status">Work Together!</h2>

            <button id="reset-button">
                Reset
            </button>
        </div>

    </main>

    <script src="../script.js"></script>

</body>
</html>
